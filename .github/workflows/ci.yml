name: CI

# Runs on every pull request into develop or main, before it can be merged. Pushes are not
# checked on their own: everything reaches develop and main through a pull request.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Critical only: the high findings are all inside Expo and React Native's own packages and
      # only an SDK upgrade fixes them.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
