<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full flow</title>
<script src="./support.js"></script>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7D96FF}a:hover{color:#9DB0FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
.press{transition:transform 140ms cubic-bezier(.3,1.4,.5,1),filter 140ms,background-color 220ms,color 220ms,border-color 220ms,box-shadow 220ms}
.press:active{transform:scale(.95);filter:brightness(1.15)}
.rise{animation:rise 520ms cubic-bezier(.2,.8,.2,1) both}
.sheet-in{animation:sheetIn 440ms cubic-bezier(.2,.9,.25,1) both}
.sheet-out{animation:sheetOut 300ms cubic-bezier(.4,0,1,1) both}
.row-in{animation:rowIn 560ms cubic-bezier(.2,.8,.2,1) both}
.row-out{animation:rowOut 280ms cubic-bezier(.4,0,1,1) both}
.row-flash{animation:rowFlash 900ms ease-out both}
.shake-a{animation:shakeA 320ms cubic-bezier(.36,.07,.19,.97) both}
.shake-b{animation:shakeB 320ms cubic-bezier(.36,.07,.19,.97) both}
.toast{animation:toast 1800ms cubic-bezier(.2,.8,.2,1) both}
.caret{animation:blink 1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes rowIn{from{max-height:0;opacity:0;transform:translateY(-10px) scale(.97)}to{max-height:80px;opacity:1;transform:none}}
@keyframes rowOut{from{max-height:80px;opacity:1}to{max-height:0;opacity:0;transform:translateX(24px)}}
@keyframes rowFlash{0%{background:rgba(125,150,255,.22)}100%{background:rgba(125,150,255,0)}}
@keyframes shakeA{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shakeB{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes toast{0%{opacity:0;transform:translateY(-16px) scale(.96)}12%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.rise,.sheet-in,.row-in,.toast{animation:fadeOnly 200ms both}.sheet-out,.row-out{animation:fadeOut 200ms both}.shake-a,.shake-b{animation:none}.press:active{transform:none}@keyframes fadeOnly{from{opacity:0}to{opacity:1}}@keyframes fadeOut{from{opacity:1}to{opacity:0}}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #F2F4F7; font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums;">

  <div style="position: absolute; inset: 0; overflow: hidden; background: #0D0F13; transform: {{sumTransform}}; filter: {{sumFilter}}; border-radius: {{sumRadius}}; transition: transform 440ms cubic-bezier(.2,.9,.25,1), filter 440ms, border-radius 440ms;">
    <div aria-hidden="true" style="position: absolute; width: 340px; height: 340px; left: -120px; top: -90px; border-radius: 50%; background: {{orbTop}}; filter: blur(70px); transition: background 600ms;"></div>
    <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; right: -120px; bottom: -60px; border-radius: 50%; background: rgba(69, 211, 168, 0.18); filter: blur(80px);"></div>

    <div style="position: relative; height: 100%; padding: 44px 12px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
      <section class="rise" aria-label="Balance card" style="border-radius: 28px; padding: 12px 12px 16px; background: {{cardFill}}; border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 20px 40px rgba(0, 0, 0, 0.35); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); transition: background 500ms;">
        <div style="display: flex; align-items: center;">
          <div style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></div>
          <h1 style="flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600;">October 2026</h1>
          <div style="width: 48px; height: 48px;"></div>
        </div>
        <div style="text-align: center; padding: 20px 0 18px;">
          <div style="font-size: 14px; font-weight: 500; color: rgba(242, 244, 247, 0.62);">Balance</div>
          <div style="font-size: 54px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.15; margin-top: 4px; color: {{amountColor}};">{{balanceText}}</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.10);">
            <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(69, 211, 168, 0.18);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#45D3A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></div>
            <div><div style="font-size: 12px; font-weight: 500; color: rgba(242, 244, 247, 0.62);">Income</div><div style="font-size: 16px; font-weight: 700; margin-top: 4px;">{{incomeText}}</div></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.10);">
            <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.10);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"></path></svg></div>
            <div><div style="font-size: 12px; font-weight: 500; color: rgba(242, 244, 247, 0.62);">Expenses</div><div style="font-size: 16px; font-weight: 700; margin-top: 4px;">{{expenseText}}</div></div>

                <span style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 15px; font-weight: 600;">{{row.label}}</span><span style="font-size: 13px; color: rgba(242, 244, 247, 0.62);">{{row.caption}}</span></span>
                <span style="font-size: 15px; font-weight: 600; color: {{row.amountInk}};">{{row.amount}}</span>
              </button>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(180deg, rgba(13, 15, 19, 0) 0%, rgba(13, 15, 19, 0.45) 100%);"></div>
    <button class="press rise" type="button" onClick="{{openAdd}}" style="position: absolute; left: 50%; bottom: 44px; margin-left: -64px; width: 128px; height: 56px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: #0D0F13; background: linear-gradient(180deg, rgba(160, 178, 255, 0.95), rgba(112, 137, 250, 0.92)); border: 1px solid rgba(255, 255, 255, 0.40); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 12px 32px rgba(125, 150, 255, 0.35); animation-delay: 240ms;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0F13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add
    </button>
  </div>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: absolute; top: 48px; left: 50%; margin-left: -70px; width: 140px; height: 44px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; background: rgba(40, 46, 60, 0.75); border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 12px 30px rgba(0, 0, 0, 0.4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); z-index: 5;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{toastInk}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      {{toastText}}
    </div>
  </sc-if>

  <sc-if value="{{sheetVisible}}" hint-placeholder-val="{{ false }}">
    <div class="{{sheetCls}}" role="dialog" aria-label="{{formTitle}}" style="position: absolute; left: 0; right: 0; top: 36px; bottom: 0; border-radius: 28px 28px 0 0; overflow: hidden; background: linear-gradient(180deg, rgba(30, 34, 46, 0.94), rgba(14, 16, 22, 0.98)); border-top: 1px solid rgba(255, 255, 255, 0.16); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);">
      <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; margin: 8px auto 0; background: rgba(255, 255, 255, 0.22);"></div>
      <div style="padding: 0 16px;">
        <div style="display: flex; align-items: center; padding-top: 4px;">
          <button class="press" type="button" aria-label="Close" onClick="{{close}}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.12);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
          <h2 style="flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600;">{{formTitle}}</h2>
          <div style="width: 48px; height: 48px;"></div>
        </div>

        <div role="radiogroup" aria-label="Type" style="position: relative; margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10);">
          <div aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)); border: 1px solid rgba(157, 176, 255, 0.55);"></div>
          <div role="radio" aria-checked="true" style="position: relative; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Expense</div>
          <div role="radio" aria-checked="false" style="position: relative; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: rgba(242, 244, 247, 0.62);">Income</div>
        </div>

        <button type="button" aria-label="{{amountSpoken}}" onClick="{{focusAmount}}" style="display: block; width: 100%; text-align: center; padding: {{amountPad}}; transition: padding 280ms cubic-bezier(.2,.9,.25,1);">
          <span style="display: block; font-size: 14px; font-weight: 500; color: rgba(242, 244, 247, 0.62);">Amount</span>
          <span class="{{shakeCls}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px;">
            <span style="font-size: 48px; font-weight: 700; letter-spacing: -1px; color: {{amountInk}};">{{amountDisplay}}</span>
            <sc-if value="{{kb}}" hint-placeholder-val="{{ false }}"><span class="caret" aria-hidden="true" style="width: 2px; height: 44px; background: #7D96FF;"></span></sc-if>
            <span style="font-size: 32px; font-weight: 600; color: rgba(242, 244, 247, 0.62);">€</span>
          </span>
          <span aria-hidden="true" style="display: block; width: 160px; height: 3px; border-radius: 3px; margin: 8px auto 0; background: {{underline}}; box-shadow: {{underlineGlow}}; transition: background 220ms, box-shadow 220ms;"></span>
        </button>
        <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: -8px 0 12px; font-size: 14px; font-weight: 600; color: #FF8A7A;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF8A7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
            Enter an amount.
          </div>
        </sc-if>

        <div style="font-size: 14px; font-weight: 500; color: rgba(242, 244, 247, 0.62); padding: 0 0 8px 8px;">Category</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{chips}}" as="chip" hint-placeholder-count="8">
            <button class="press" type="button" aria-pressed="{{chip.selected}}" onClick="{{chip.pick}}" style="min-height: 48px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: {{chip.weight}}; color: {{chip.ink}}; background: {{chip.bg}}; border: 1px solid {{chip.border}}; box-shadow: {{chip.glow}};">{{chip.label}}</button>
          </sc-for>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; opacity: {{fieldsOpacity}}; transition: opacity 200ms;">
          <div>
            <div style="font-size: 14px; font-weight: 500; color: rgba(242, 244, 247, 0.62); padding: 0 0 8px 8px;">Date</div>
            <div style="min-height: 52px; box-sizing: border-box; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.10);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(242,244,247,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
              06/10/2026
            </div>
          </div>
          <div>
            <div style="font-size: 14px; font-weight: 500; color: rgba(242, 244, 247, 0.62); padding: 0 0 8px 8px;">Note (optional)</div>
            <div style="min-height: 52px; box-sizing: border-box; border-radius: 16px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: {{noteInk}}; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.10);">{{noteText}}</div>
          </div>
        </div>
      </div>

      <div style="position: absolute; left: 16px; right: 16px; bottom: {{footerBottom}}; display: flex; flex-direction: column; gap: 4px; transition: bottom 300ms cubic-bezier(.2,.9,.25,1);">
        <sc-if value="{{isEdit}}" hint-placeholder-val="{{ false }}">
          <button class="press" type="button" onClick="{{remove}}" style="align-self: center; min-height: 48px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #FF8A7A;">Delete</button>
        </sc-if>
        <button class="press" type="button" onClick="{{save}}" style="min-height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #0D0F13; background: linear-gradient(180deg, rgba(160, 178, 255, 0.95), rgba(112, 137, 250, 0.92)); border: 1px solid rgba(255, 255, 255, 0.40); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 12px 32px rgba(125, 150, 255, 0.35);">Save</button>
      </div>

      <div aria-hidden="{{kbHidden}}" style="position: absolute; left: 0; right: 0; bottom: 0; height: 248px; box-sizing: border-box; padding: 6px 6px 10px; background: rgba(32, 36, 46, 0.96); border-top: 1px solid rgba(255, 255, 255, 0.08); transform: translateY({{kbY}}); transition: transform 300ms cubic-bezier(.2,.9,.25,1);">
        <div style="display: flex; justify-content: flex-end; height: 32px; align-items: center; padding: 0 8px;">
          <button type="button" onClick="{{hideKb}}" style="font-size: 14px; font-weight: 600; color: #9DB0FF; min-height: 32px; padding: 0 8px;">Done</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{keys}}" as="key" hint-placeholder-count="12">
            <button class="press" type="button" aria-label="{{key.label}}" onClick="{{key.press}}" style="height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; background: rgba(255, 255, 255, 0.10);">{{key.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var rows = [
      { id: 4, cat: 'Food', note: 'Groceries', date: '05/10/2026', spokenDate: '5 October 2026', cents: 4280, income: false, cls: '' },
      { id: 3, cat: 'Transport', note: 'Metro card', date: '03/10/2026', spokenDate: '3 October 2026', cents: 1840, income: false, cls: '' },
      { id: 2, cat: 'Housing', note: 'Rent', date: '01/10/2026', spokenDate: '1 October 2026', cents: 65000, income: false, cls: '' },
      { id: 1, cat: 'Salary', note: '', date: '01/10/2026', spokenDate: '1 October 2026', cents: 245000, income: true, cls: '' }
    ];
    this.state = {
      rows: rows, nextId: 5, sheet: 'closed', mode: 'add', editId: null,
      kb: false, amount: '', category: 'Food', error: false, shakeFlip: false,
      shown: this.balanceOf(rows), toast: null, toastKey: 0
    };
  }
  balanceOf(rows) {
    return rows.reduce(function (sum, r) { return sum + (r.income ? r.cents : -r.cents); }, 0);
  }
  fmt(cents, sign) {
    var abs = Math.abs(Math.round(cents));
    var euros = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    var dec = String(abs % 100).padStart(2, '0');
    var prefix = sign === '+' ? '+' : (cents < 0 || sign === '-') ? '−' : '';
    return prefix + euros + ',' + dec + ' €';
  }
  parse(text) {
    if (!text) return 0;
    var parts = text.split(',');
    var euros = Number(parts[0] || '0');
    var dec = (parts[1] || '').padEnd(2, '0').slice(0, 2);
    return euros * 100 + Number(dec);
  }
  toText(cents) {
    var dec = cents % 100;
    return String(Math.floor(cents / 100)) + (dec ? ',' + String(dec).padStart(2, '0') : '');
  }
  animateTo(target) {
    var from = this.state.shown;
    var start = null;
    var self = this;
    if (this.raf) cancelAnimationFrame(this.raf);
    var step = function (t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / 560);
      var eased = 1 - Math.pow(1 - p, 3);
      self.setState({ shown: Math.round(from + (target - from) * eased) });
      if (p < 1) self.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  later(fn, ms) {
    var self = this;
    this.timers = this.timers || [];
    this.timers.push(setTimeout(function () { fn.call(self); }, ms));
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
    (this.timers || []).forEach(clearTimeout);
  }
  showToast(text) {
    this.setState({ toast: text, toastKey: this.state.toastKey + 1 });
    var key = this.state.toastKey + 1;
    this.later(function () { if (this.state.toastKey === key) this.setState({ toast: null }); }, 1800);
  }
  closeSheet(after) {
    this.setState({ sheet: 'closing', kb: false });
    this.later(function () {
      this.setState({ sheet: 'closed' });
      if (after) after.call(this);
    }, 300);
  }
  setRowCls(id, cls) {
    this.setState({ rows: this.state.rows.map(function (r) { return r.id === id ? Object.assign({}, r, { cls: cls }) : r; }) });
  }
  save() {
    var cents = this.parse(this.state.amount);
    if (cents <= 0) {
      this.setState({ error: true, shakeFlip: !this.state.shakeFlip, kb: true });
      return;
    }
    var mode = this.state.mode;
    var editId = this.state.editId;
    var category = this.state.category;
    this.closeSheet(function () {
      var rows;
      var id;
      if (mode === 'add') {
        id = this.state.nextId;
        rows = [{ id: id, cat: category, note: '', date: '06/10/2026', spokenDate: '6 October 2026', cents: cents, income: false, cls: 'row-in' }].concat(this.state.rows);
        this.setState({ rows: rows, nextId: id + 1 });
        this.showToast('Saved');
      } else {
        id = editId;
        rows = this.state.rows.map(function (r) { return r.id === id ? Object.assign({}, r, { cents: cents, cat: category, cls: 'row-flash' }) : r; });
        this.setState({ rows: rows });
        this.showToast('Saved');
      }
      this.animateTo(this.balanceOf(rows));
      this.later(function () { this.setRowCls(id, ''); }, 950);
    });
  }
  remove() {
    var id = this.state.editId;
    this.closeSheet(function () {
      this.setRowCls(id, 'row-out');
      this.later(function () {
        var rows = this.state.rows.filter(function (r) { return r.id !== id; });
        this.setState({ rows: rows });
        this.animateTo(this.balanceOf(rows));
        this.showToast('Deleted');
      }, 280);
    });
  }
  press(key) {
    var a = this.state.amount;
    if (key === '⌫') a = a.slice(0, -1);
    else if (key === ',') { if (a.indexOf(',') === -1) a = (a || '0') + ','; }
    else {
      var parts = a.split(',');
      if (parts.length === 2 && parts[1].length >= 2) return;
      if (parts.length === 1 && parts[0].length >= 6) return;
      a = a === '0' ? key : a + key;
    }
    this.setState({ amount: a, error: false });
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var rows = s.rows;
    var income = rows.filter(function (r) { return r.income; }).reduce(function (n, r) { return n + r.cents; }, 0);
    var expenses = rows.filter(function (r) { return !r.income; }).reduce(function (n, r) { return n + r.cents; }, 0);
    var open = s.sheet !== 'closed';
    var behind = s.sheet === 'open';
    var expenseCats = ['Food', 'Transport', 'Housing', 'Bills', 'Health', 'Shopping', 'Leisure', 'Other'];
    var editRow = rows.filter(function (r) { return r.id === s.editId; })[0];
    return {
      sumTransform: behind ? 'scale(0.92) translateY(6px)' : 'none',
      sumFilter: behind ? 'brightness(0.55)' : 'none',
      sumRadius: behind ? '28px' : '0px',
      orbTop: s.shown < 0 ? 'rgba(255, 154, 140, 0.30)' : 'rgba(125, 150, 255, 0.38)',
      cardFill: s.shown < 0
        ? 'linear-gradient(160deg, rgba(255, 154, 140, 0.16), rgba(255, 154, 140, 0.04))'
        : 'linear-gradient(160deg, rgba(157, 176, 255, 0.16), rgba(255, 255, 255, 0.03))',
      amountColor: s.shown < 0 ? '#FF9A8C' : '#F2F4F7',
      balanceText: this.fmt(s.shown),
      incomeText: this.fmt(income),
      expenseText: this.fmt(expenses),
      rows: rows.map(function (r, i) {
        return {
          cls: r.cls,
          divider: i === rows.length - 1 ? '0' : '1px solid rgba(255, 255, 255, 0.07)',
          label: r.cat,
          initial: r.cat[0],
          caption: (r.note ? r.note + ' · ' : '') + r.date,
          amount: self.fmt(r.income ? r.cents : -r.cents, r.income ? '+' : '-'),
          spoken: (r.income ? 'Income, ' : 'Expense, ') + r.cat + ', ' + self.fmt(r.cents) + ', ' + r.spokenDate + (r.note ? ', note: ' + r.note : ''),
          avatarBg: r.income ? 'rgba(69, 211, 168, 0.16)' : 'rgba(255, 255, 255, 0.07)',
          avatarInk: r.income ? '#45D3A8' : 'rgba(242, 244, 247, 0.62)',
          amountInk: r.income ? '#45D3A8' : '#F2F4F7',
          open: function () {
            if (r.income) return;
            self.setState({ sheet: 'open', mode: 'edit', editId: r.id, amount: self.toText(r.cents), category: r.cat, kb: false, error: false });
          }
        };
      }),
      openAdd: function () { self.setState({ sheet: 'open', mode: 'add', editId: null, amount: '', category: 'Food', kb: false, error: false }); },
      close: function () { self.closeSheet(); },
      save: function () { self.save(); },
      remove: function () { self.remove(); },
      sheetVisible: open,
      sheetCls: s.sheet === 'closing' ? 'sheet-out' : 'sheet-in',
      formTitle: s.mode === 'edit' ? 'Edit transaction' : 'Add transaction',
      isEdit: s.mode === 'edit',
      kb: s.kb,
      kbHidden: s.kb ? 'false' : 'true',
      kbY: s.kb ? '0' : '100%',
      footerBottom: s.kb ? '260px' : '40px',
      amountPad: s.kb ? '12px 0 12px' : '28px 0 20px',
      fieldsOpacity: s.kb ? 0 : 1,
      focusAmount: function () { self.setState({ kb: true }); },
      hideKb: function () { self.setState({ kb: false }); },
      amountDisplay: s.amount || '0,00',
      amountInk: s.amount ? '#F2F4F7' : 'rgba(242, 244, 247, 0.35)',
      amountSpoken: 'Amount, ' + (s.amount || 'required') + (s.error ? ', Enter an amount.' : ''),
      shakeCls: s.error ? (s.shakeFlip ? 'shake-a' : 'shake-b') : '',
      error: s.error,
      underline: s.error ? '#FF8A7A' : s.kb ? '#7D96FF' : '#626B7C',
      underlineGlow: s.error ? '0 0 14px rgba(255, 138, 122, 0.55)' : s.kb ? '0 0 16px rgba(125, 150, 255, 0.6)' : 'none',
      noteText: editRow && s.mode === 'edit' && editRow.note ? editRow.note : 'Add a note',
      noteInk: editRow && s.mode === 'edit' && editRow.note ? '#F2F4F7' : 'rgba(242, 244, 247, 0.45)',
      chips: expenseCats.map(function (label) {
        var on = s.category === label;
        return {
          label: label,
          selected: on ? 'true' : 'false',
          weight: on ? 600 : 500,
          ink: on ? '#0D0F13' : '#F2F4F7',
          bg: on ? '#8EA4FF' : 'rgba(255, 255, 255, 0.06)',
          border: on ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.10)',
          glow: on ? 'inset 0 1px 0 rgba(255,255,255,0.45), 0 8px 22px rgba(125,150,255,0.35)' : 'none',
          pick: function () { self.setState({ category: label }); }
        };
      }),
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫'].map(function (k) {
        return { label: k, press: function () { self.press(k); } };
      }),
      toastOn: s.toast !== null,
      toastText: s.toast || '',
      toastInk: s.toast === 'Deleted' ? '#FF8A7A' : '#45D3A8'
    };
  }
}
</script>
</body>
</html>
