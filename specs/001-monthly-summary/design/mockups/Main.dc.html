<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Summary, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1F3FB0}
button{font:inherit;border:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; color: #0E1116; font-family: {{fontFamily}}; position: relative; overflow: hidden; font-variant-numeric: tabular-nums">

  <div style="margin: 12px 12px 0 12px; background: {{hero}}; color: #0E1116; border-radius: 28px; padding: 12px 12px 16px 12px; display: flex; flex-direction: column; position: relative; overflow: hidden">
    <div style="position: absolute; width: 260px; height: 260px; border-radius: 130px; right: -90px; top: -110px; background: rgba(36,67,199,0.06)"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; position: relative">
      <button aria-label="Previous month, September 2026" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #0E1116; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div style="font-size: 16px; font-weight: 600">October 2026</div>
      <div style="width: 48px; height: 48px"></div>
    </div>
    <div style="padding: 28px 12px 24px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative">
      <div style="font-size: 14px; font-weight: 500; color: #4A5578">Balance</div>
      <div style="font-size: 54px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.1; color: #1D34A6">1235,30 €</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; position: relative">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #E3F4EE; color: #0B6B5E; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <div style="font-size: 12px; font-weight: 500; color: #4A5578">Income</div>
          <div style="font-size: 16px; font-weight: 700">2000,00 €</div>
        </div>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #ECEEF2; color: #0E1116; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <div style="font-size: 12px; font-weight: 500; color: #4A5578">Expenses</div>
          <div style="font-size: 16px; font-weight: 700">764,70 €</div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 24px 8px 24px; font-size: 15px; font-weight: 600">Spending by category</div>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF0F3">
      <div style="font-size: 15px; font-weight: 500">Housing</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="font-size: 15px; font-weight: 600">650,00 €</div>
        <div style="font-size: 12px; font-weight: 600; color: {{accent}}; background: #EAF0FF; border-radius: 8px; padding: 4px 8px; min-width: 32px; text-align: center">85%</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF0F3">
      <div style="font-size: 15px; font-weight: 500">Food</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="font-size: 15px; font-weight: 600">76,70 €</div>
        <div style="font-size: 12px; font-weight: 600; color: {{accent}}; background: #EAF0FF; border-radius: 8px; padding: 4px 8px; min-width: 32px; text-align: center">10%</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0">
      <div style="font-size: 15px; font-weight: 500">Transport</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="font-size: 15px; font-weight: 600">38,00 €</div>
        <div style="font-size: 12px; font-weight: 600; color: {{accent}}; background: #EAF0FF; border-radius: 8px; padding: 4px 8px; min-width: 32px; text-align: center">5%</div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 24px 8px 24px; font-size: 15px; font-weight: 600">Transactions</div>
  <div style="margin: 0 16px; background: #FFFFFF; border-radius: 20px; padding: 4px 16px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0F3">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F1F3F6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #5B6472">F</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">Food</div>
        <div style="font-size: 13px; color: #5B6472">Lunch · 05/10/2026</div>
      </div>
      <div style="font-size: 15px; font-weight: 600">−12,50 €</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0F3">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F1F3F6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #5B6472">F</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">Food</div>
        <div style="font-size: 13px; color: #5B6472">Groceries · 04/10/2026</div>
      </div>
      <div style="font-size: 15px; font-weight: 600">−64,20 €</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F1F3F6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #5B6472">T</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <div style="font-size: 15px; font-weight: 600">Transport</div>
        <div style="font-size: 13px; color: #5B6472">Monthly pass · 03/10/2026</div>
      </div>
      <div style="font-size: 15px; font-weight: 600">−38,00 €</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, rgba(246,247,249,0), #F6F7F9 55%)"></div>
  <button aria-label="Add transaction" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); height: 56px; padding: 0 28px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(47,91,234,0.28)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Add
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#6D4AE0","#0E1116"]},"hero":{"editor":"color","default":"#E8EDFF","options":["#E8EDFF","#FFFFFF","#EEE9FF","#E3F4EE"]},"typeface":{"editor":"enum","options":["System (Roboto)","Manrope"],"default":"Manrope"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tf = this.props.typeface ?? 'Manrope';
    return {
      accent: this.props.accent ?? '#2F5BEA',
      hero: this.props.hero ?? '#E8EDFF',
      fontFamily: tf === 'Manrope' ? "'Manrope', system-ui, sans-serif" : "system-ui, 'Roboto', sans-serif"
    };
  }
}
</script>
</body>
</html>
