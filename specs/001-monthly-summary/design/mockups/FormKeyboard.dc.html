<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add transaction with the keyboard open, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1F3FB0}
button{font:inherit;border:0;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #0E1116; font-family: {{fontFamily}}; position: relative; overflow: hidden; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 8px 16px">
    <button aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; background: #F1F3F6; color: #0E1116; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div style="font-size: 17px; font-weight: 600">Add transaction</div>
    <div style="width: 48px; height: 48px"></div>
  </div>

  <div style="padding: 8px 16px 0 16px">
    <div role="radiogroup" aria-label="Type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #F1F3F6; border-radius: 16px; padding: 4px">
      <button role="radio" aria-checked="true" style="height: 48px; border-radius: 12px; background: #FFFFFF; color: #0E1116; font-size: 15px; font-weight: 600; box-shadow: inset 0 0 0 1.5px {{accent}}">Expense</button>
      <button role="radio" aria-checked="false" style="height: 48px; border-radius: 12px; background: transparent; color: #5B6472; font-size: 15px; font-weight: 500">Income</button>
    </div>
  </div>

  <div style="padding: 16px 24px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <label for="amount-k" style="font-size: 14px; color: #5B6472; font-weight: 500">Amount</label>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <input id="amount-k" value="12,5" inputmode="decimal" style="width: 150px; border: 0; outline: none; text-align: right; font-size: 48px; font-weight: 700; letter-spacing: -1px; color: #0E1116; background: transparent; padding: 0">
      <span style="font-size: 32px; font-weight: 600; color: #5B6472">€</span>
    </div>
    <div style="width: 160px; height: 3px; border-radius: 2px; background: {{accent}}"></div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 14px; color: #5B6472; font-weight: 500; padding-left: 8px">Category</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button aria-pressed="true" style="height: 48px; padding: 0 16px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600">Food</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Transport</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Housing</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Bills</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Health</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Shopping</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Leisure</button>
      <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 24px; background: #F1F3F6; color: #0E1116; font-size: 15px; font-weight: 500">Other</button>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 16px 12px 16px">
    <button style="width: 100%; height: 56px; border-radius: 28px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600">Save</button>
  </div>

  <div aria-hidden="true" style="height: 286px; background: #E4E7EC; padding: 8px 6px 12px 6px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 22px; font-weight: 500; color: #0E1116">
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">1</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">2</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">3</div>
    <div style="background: #CFD4DC; border-radius: 8px; display: flex; align-items: center; justify-content: center">−</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">4</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">5</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">6</div>
    <div style="background: #CFD4DC; border-radius: 8px; display: flex; align-items: center; justify-content: center">␣</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">7</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">8</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">9</div>
    <div style="background: #CFD4DC; border-radius: 8px; display: flex; align-items: center; justify-content: center">⌫</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">,</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">0</div>
    <div style="background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">.</div>
    <div style="background: #2F5BEA; color: #FFFFFF; border-radius: 8px; display: flex; align-items: center; justify-content: center">✓</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0F7B6C","#6D4AE0","#0E1116"]},"typeface":{"editor":"enum","options":["System (Roboto)","Manrope"],"default":"Manrope"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tf = this.props.typeface ?? 'Manrope';
    return {
      accent: this.props.accent ?? '#2F5BEA',
      fontFamily: tf === 'Manrope' ? "'Manrope', system-ui, sans-serif" : "system-ui, 'Roboto', sans-serif"
    };
  }
}
</script>
</body>
</html>
