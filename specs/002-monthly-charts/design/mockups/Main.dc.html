<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Summary with pace card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1D34A6}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn 200ms cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop 200ms cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}.pop{animation:fadeIn 200ms both}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: Manrope, system-ui, sans-serif; font-variant-numeric: tabular-nums;">
  <div style="padding-top: 44px; display: flex; flex-direction: column;">

    <section aria-label="Balance card" style="margin: 0 12px; border-radius: 28px; padding: 12px 12px 16px; background: {{t.cardFill}}; box-shadow: {{t.cardShadow}}; color: #FFFFFF;">
      <div style="display: flex; justify-content: center;">
        <button type="button" aria-label="October 2026" aria-description="Changes the month" style="min-height: 48px; padding: 0 16px 0 20px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: rgba(10, 14, 40, 0.18); border: 1px solid rgba(255, 255, 255, 0.3); font-size: 16px; font-weight: 600; color: #FFFFFF;">
          October 2026
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
        <div style="height: 140px; display: flex; align-items: center; justify-content: center;">
          <div class="spin" role="progressbar" aria-label="Loading" style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.25); border-top-color: #FFFFFF; box-sizing: border-box;"></div>
        </div>
      </sc-if>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
        <div style="text-align: center; padding: 28px 0 24px;">
          <div style="font-size: 16px; font-weight: 500; color: #E7EAFF;">Balance</div>
          <div style="font-size: 62px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; margin-top: 4px;">1.165,40 €</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: rgba(10, 14, 40, 0.18); border: 1px solid rgba(255, 255, 255, 0.3);">
            <div aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #E3F4EE;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6B5E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></div>
            <div><div style="font-size: 14px; font-weight: 500; color: #E7EAFF;">Income</div><div style="font-size: 19px; font-weight: 700; margin-top: 4px;">2.450,00 €</div></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: rgba(10, 14, 40, 0.18); border: 1px solid rgba(255, 255, 255, 0.3);">
            <div aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.2);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg></div>
            <div><div style="font-size: 14px; font-weight: 500; color: #E7EAFF;">Expenses</div><div style="font-size: 19px; font-weight: 700; margin-top: 4px;">1.284,60 €</div></div>
          </div>
        </div>
      </sc-if>
    </section>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div style="margin: 12px 16px 0; padding: 16px; border-radius: 20px; background: {{t.surface}}; box-shadow: {{t.tileShadow}}; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 14px; font-weight: 600; color: {{t.textMuted}};">Spending pace</div>
        <div style="height: 122px; display: flex; align-items: center; justify-content: center;">
          <div class="spin" role="progressbar" aria-label="Loading" style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid {{t.accentTrack}}; border-top-color: {{t.accent}}; box-sizing: border-box;"></div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <button type="button" aria-label="{{paceLabel}}" aria-description="Opens Insights" style="margin: 12px 16px 0; padding: 16px; border-radius: 20px; background: {{t.surface}}; box-shadow: {{t.tileShadow}}; display: flex; flex-direction: column; gap: 8px; text-align: left;">
        <span style="display: flex; align-items: center; width: 100%;">
          <span style="flex: 1; font-size: 14px; font-weight: 600; color: {{t.textMuted}};">Spending pace</span>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.textMuted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </span>
        <span style="font-size: 17px; font-weight: 600; line-height: 24px;">{{sentence}}</span>
        <svg aria-hidden="true" width="326" height="64" viewBox="0 0 326 64" style="display: block; margin-top: 4px;">
          <defs>
            <linearGradient id="cardArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="{{t.accent}}" stop-opacity="0.22"></stop>
              <stop offset="1" stop-color="{{t.accent}}" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <line x1="0" y1="60" x2="326" y2="60" stroke="{{t.grid}}" stroke-width="1"></line>
          <path d="M5.3 39.4 L15.8 38.4 L26.3 37.8 L36.8 36.3 L47.3 35.1 L57.8 34.2 L68.4 32.4 L78.9 31 L89.4 29.7 L99.9 28.1 L110.4 26.1 L120.9 24 L131.5 22.8 L142 22 L152.5 20.4 L163 19.5 L173.5 18.6 L184 17.1 L194.5 16.2 L205.1 15 L215.6 13.8 L226.1 13.1 L236.6 12.3 L247.1 11.7 L257.6 10.6 L268.2 9.9 L278.7 9.3 L289.2 8.8 L299.7 8.4 L310.2 8.1" fill="none" stroke="{{t.prev}}" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" opacity="{{prevOpacity}}"></path>
          <path d="M5.3 38.9 L15.8 38.1 L26.3 37.5 L36.8 36.1 L47.3 34.8 L57.8 33.6 L68.4 31.4 L78.9 29.7 L89.4 28.2 L99.9 25.6 L110.4 23.7 L120.9 21.5 L120.9 60 L5.3 60 Z" fill="url(#cardArea)"></path>
          <path d="M5.3 38.9 L15.8 38.1 L26.3 37.5 L36.8 36.1 L47.3 34.8 L57.8 33.6 L68.4 31.4 L78.9 29.7 L89.4 28.2 L99.9 25.6 L110.4 23.7 L120.9 21.5" fill="none" stroke="{{t.accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="120.9" cy="21.5" r="4.5" fill="{{t.accent}}" stroke="{{t.surface}}" stroke-width="2"></circle>
        </svg>
        <span aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; font-weight: 500; color: {{t.textMuted}};">
          <span style="display: inline-flex; align-items: center; gap: 8px;"><svg width="18" height="6" viewBox="0 0 18 6"><line x1="1.5" y1="3" x2="16.5" y2="3" stroke="{{t.accent}}" stroke-width="3" stroke-linecap="round"></line></svg>October</span>
          <sc-if value="{{hasPrev}}" hint-placeholder-val="{{ true }}">
            <span style="display: inline-flex; align-items: center; gap: 8px;"><svg width="18" height="6" viewBox="0 0 18 6"><line x1="0" y1="3" x2="18" y2="3" stroke="{{t.prev}}" stroke-width="2" stroke-dasharray="6 4"></line></svg>September</span>
          </sc-if>
        </span>
      </button>

      <h2 style="margin: 0; padding: 16px 24px 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Spending by category</h2>
      <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden;">
        <div style="flex: none; min-width: 132px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.surface}}; box-shadow: {{t.tileShadow}}; display: flex; flex-direction: column; gap: 4px;">
          <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.tint.housing}}; margin-bottom: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.cat.housing}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
          <div style="font-size: 15px; font-weight: 500;">Housing</div>
          <div style="font-size: 17px; font-weight: 600; color: {{t.cat.housing}};">51%</div>
          <div style="font-size: 13px; color: {{t.textMuted}};">650,00 €</div>
        </div>
        <div style="flex: none; min-width: 132px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.surface}}; box-shadow: {{t.tileShadow}}; display: flex; flex-direction: column; gap: 4px;">
          <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.tint.food}}; margin-bottom: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.cat.food}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg></div>
          <div style="font-size: 15px; font-weight: 500;">Food</div>
          <div style="font-size: 17px; font-weight: 600; color: {{t.cat.food}};">29%</div>
          <div style="font-size: 13px; color: {{t.textMuted}};">372,30 €</div>
        </div>
        <div style="flex: none; min-width: 132px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.surface}}; box-shadow: {{t.tileShadow}}; display: flex; flex-direction: column; gap: 4px;">
          <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.tint.leisure}}; margin-bottom: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.cat.leisure}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg></div>
          <div style="font-size: 15px; font-weight: 500;">Leisure</div>
          <div style="font-size: 17px; font-weight: 600; color: {{t.cat.leisure}};">10%</div>
          <div style="font-size: 13px; color: {{t.textMuted}};">125,90 €</div>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; padding: 16px 16px 8px 24px;">
      <h2 style="flex: 1; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Transactions</h2>
      <button type="button" style="min-height: 48px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: {{t.addFill}}; border: 1px solid {{t.addRim}}; box-shadow: {{t.addShadow}}; font-size: 16px; font-weight: 600;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add
      </button>
    </div>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; padding: 0 24px 8px; font-size: 14px;"><span style="flex: 1; font-weight: 500;">Today</span><span style="font-weight: 600;">-42,80 €</span></div>
      <div style="margin: 0 16px; border-radius: 20px; background: {{t.surface}}; padding: 4px 16px;">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px;">
          <div aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.tint.food}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.cat.food}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg></div>
          <div style="flex: 1;"><div style="font-size: 15px; font-weight: 600;">Food</div><div style="font-size: 13px; color: {{t.textMuted}}; margin-top: 4px;">Groceries</div></div>
          <div style="font-size: 15px; font-weight: 600;">-42,80 €</div>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{pk.open}}" hint-placeholder-val="{{ false }}">
    <div class="fade" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; padding: 0 24px;">
      <div class="pop" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" style="width: 100%; max-width: 360px; box-sizing: border-box; padding: 24px; border-radius: 28px; background: {{t.surface}}; display: flex; flex-direction: column; gap: 16px;">
        <h2 id="pickerTitle" style="margin: 0; font-size: 17px; font-weight: 600;">Choose month</h2>
        <div style="display: flex; align-items: center;">
          <button type="button" aria-label="Previous year" disabled="{{pk.prevDisabled}}" onClick="{{pk.prevYear}}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.muted}}; opacity: {{pk.prevOpacity}};">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div aria-label="{{pk.year}}" style="flex: 1; text-align: center; font-size: 17px; font-weight: 600;">{{pk.year}}</div>
          <button type="button" aria-label="Next year" disabled="{{pk.nextDisabled}}" onClick="{{pk.nextYear}}" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.muted}}; opacity: {{pk.nextOpacity}};">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{pk.cells}}" as="c" hint-placeholder-count="12">
            <button type="button" aria-label="{{c.label}}" aria-pressed="{{c.selected}}" disabled="{{c.disabled}}" onClick="{{c.pick}}" style="min-height: 48px; border-radius: 16px; box-sizing: border-box; text-align: center; font-size: 15px; font-weight: {{c.weight}}; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.border}}; opacity: {{c.opacity}};">{{c.short}}</button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 8px;">
          <button type="button" onClick="{{pk.thisMonth}}" style="flex: 1; min-height: 48px; border-radius: 999px; background: {{t.muted}}; color: {{t.accent}}; text-align: center; font-size: 16px; font-weight: 600;">This month</button>
          <button type="button" style="flex: 1; min-height: 48px; border-radius: 999px; background: {{t.muted}}; text-align: center; font-size: 16px; font-weight: 600;">Close</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"card":{"editor":"enum","options":["ready","oneLine","loading"],"default":"ready"},"picker":{"editor":"boolean","default":false},"pickerYear":{"editor":"int","min":2000,"max":2026,"default":2026},"$preview":{"width":390,"height":844}}'>
const rgba = (hex, a) => {
  const n = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return 'rgba(' + n.join(', ') + ', ' + a + ')';
};
const metal = (base, sheen, end) => 'linear-gradient(135deg, ' + base + ' 0%, ' + base + ' 30%, ' + sheen + ' 48%, ' + base + ' 66%, ' + end + ' 100%)';
const CATS = {
  light: { food: '#C2410C', transport: '#1864AB', housing: '#6741D9', bills: '#0B7285', health: '#C92A2A', shopping: '#A61E4D', leisure: '#237032' },
  dark: { food: '#FF922B', transport: '#4DABF7', housing: '#9775FA', bills: '#3BC9DB', health: '#FF6B6B', shopping: '#F06595', leisure: '#69DB7C' },
};
const tints = (cats, a) => Object.fromEntries(Object.entries(cats).map(([k, v]) => [k, rgba(v, a)]));
const TOK = {
  light: {
    bg: '#F2F3F7', surface: '#FFFFFF', muted: '#F1F3F6', text: '#0E1116', textMuted: '#5B6472',
    accent: '#2F5BEA', onAccent: '#FFFFFF', accentTrack: rgba('#2F5BEA', 0.18), prev: '#7D8696', grid: rgba('#0E1116', 0.08),
    tileShadow: '0 2px 8px ' + rgba('#0E1116', 0.06),
    cardFill: metal('#1E2E73', '#2C43A0', '#15215A'), cardShadow: '0 16px 36px ' + rgba('#1E2E73', 0.35),
    addFill: rgba('#FFFFFF', 0.85), addRim: '#FFFFFF', addShadow: '0 8px 24px ' + rgba('#0E1116', 0.05),
    cat: CATS.light, tint: tints(CATS.light, 0.14),
  },
  dark: {
    bg: '#07080A', surface: '#1B1D24', muted: '#262A33', text: '#F2F4F7', textMuted: '#B0B8C6',
    accent: '#7D96FF', onAccent: '#0D0F13', accentTrack: rgba('#7D96FF', 0.22), prev: '#7D8696', grid: rgba('#FFFFFF', 0.08),
    tileShadow: 'none',
    cardFill: metal('#1B2A6B', '#2A3F97', '#131E50'), cardShadow: '0 20px 40px ' + rgba('#000000', 0.45),
    addFill: rgba('#FFFFFF', 0.08), addRim: rgba('#FFFFFF', 0.14), addShadow: '0 20px 40px ' + rgba('#000000', 0.35),
    cat: CATS.dark, tint: tints(CATS.dark, 0.18),
  },
};
const SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const TODAY = { y: 2026, m: 9 };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { year: null, sel: { y: 2026, m: 9 } };
  }
  renderVals() {
    const t = this.props.dark ? TOK.dark : TOK.light;
    const card = this.props.card ?? 'ready';
    const oneLine = card === 'oneLine';
    const sentence = oneLine ? 'No data from last month to compare' : '85,00 € more than last month by day 12';
    const year = this.state.year ?? this.props.pickerYear ?? 2026;
    const sel = this.state.sel;
    const cells = SHORT.map((short, m) => {
      const disabled = year > TODAY.y || (year === TODAY.y && m > TODAY.m);
      const selected = sel.y === year && sel.m === m;
      const isToday = TODAY.y === year && TODAY.m === m;
      return {
        short,
        label: FULL[m] + ' ' + year,
        disabled,
        selected,
        weight: selected ? 600 : 500,
        bg: selected ? t.accent : disabled ? 'transparent' : t.muted,
        fg: selected ? t.onAccent : t.text,
        border: selected || isToday ? t.accent : 'transparent',
        opacity: disabled ? 0.4 : 1,
        pick: () => this.setState({ sel: { y: year, m } }),
      };
    });
    return {
      t,
      loading: card === 'loading',
      ready: card !== 'loading',
      hasPrev: !oneLine,
      prevOpacity: oneLine ? 0 : 1,
      sentence,
      paceLabel: 'Spending pace, ' + sentence,
      pk: {
        open: !!this.props.picker,
        year,
        cells,
        prevDisabled: year <= 2000,
        nextDisabled: year >= TODAY.y,
        prevOpacity: year <= 2000 ? 0.4 : 1,
        nextOpacity: year >= TODAY.y ? 0.4 : 1,
        prevYear: () => this.setState({ year: Math.max(2000, year - 1) }),
        nextYear: () => this.setState({ year: Math.min(TODAY.y, year + 1) }),
        thisMonth: () => this.setState({ year: TODAY.y, sel: { y: TODAY.y, m: TODAY.m } }),
      },
    };
  }
}
</script>
</body>
</html>
