<head>

<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

    </span>
    <span style="font-size: 34px; font-weight: 600; line-height: 1.3;">999.999.999,99 € more than last month by day 12</span>

      <path d="M5.3 38.9 L15.8 38.1 L26.3 37.5 L36.8 36.1 L47.3 34.8 L57.8 33.6 L68.4 31.4 L78.9 29.7 L89.4 28.2 L99.9 25.6 L110.4 23.7 L120.9 21.5" fill="none" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="120.9" cy="21.5" r="4.5" fill="#2F5BEA" stroke="#FFFFFF" stroke-width="2"></circle>
    </svg>
    <span aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px; font-size: 26px; font-weight: 500; color: #5B6472;">
      <span style="display: inline-flex; align-items: center; gap: 8px;"><svg width="18" height="6" viewBox="0 0 18 6"><line x1="1.5" y1="3" x2="16.5" y2="3" stroke="#2F5BEA" stroke-width="3" stroke-linecap="round"></line></svg>October</span>

    </span>

  <h2 style="margin: 0; padding: 16px 24px 0; font-size: 44px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2;">Categories vs last month</h2>

    <div style="font-size: 26px; font-weight: 500; color: #5B6472;">Compared by day 12</div>
    <div role="group" aria-label="Transport, this month 999.999.999,99 €, last month 999.000.000,00 €, plus 999.999,99 €, plus less than 1 percent" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0;">
      <div style="display: flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1864AB; flex: none;"></span><span style="font-size: 30px; font-weight: 600;">Transport</span></div>
      <div style="padding-left: 16px; display: flex; flex-direction: column; gap: 8px;">
        <div><div style="font-size: 26px; font-weight: 500; color: #5B6472;">This month</div><div style="font-size: 30px; font-weight: 500;">999.999.999,99 €</div></div>

        <div>
          <div style="font-size: 26px; font-weight: 500; color: #5B6472;">Change</div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;"><span style="font-size: 30px; font-weight: 600;">+999.999,99 €</span><span style="padding: 4px 8px; border-radius: 8px; font-size: 24px; font-weight: 600; color: #B3362A; background: rgba(179, 54, 42, 0.12);">+&lt;1%</span></div>
        </div>
      </div>
    </div>
  </div>

  <h2 style="margin: 0; padding: 16px 24px 0; font-size: 44px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2;">Savings trend</h2>
  <div style="margin: 0 16px; padding: 16px; border-radius: 20px; background: #FFFFFF;">
    <div style="font-size: 34px; font-weight: 600; line-height: 1.3;">Saved 5.999.999.999,94 € in 6 months · 15%</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
